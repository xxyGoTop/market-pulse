appId: com.marketpulse.app
productName: Market Pulse
copyright: Copyright © 2026 Market Pulse
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/tray-light.png
  - build/tray-dark.png
  - build/tray.png
  # macOS 菜单栏模板图（含 @2x），必须打进包里
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json
extraMetadata:
  main: dist-electron/main.js
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Market Pulse
  deleteAppDataOnUninstall: false
# macOS 包只能在 macOS 上构建：dmg 依赖系统的 hdiutil，签名/公证依赖 codesign 与 Xcode 工具链。
# 这里只做「本地自用」配置：不签名、不公证，Apple Silicon 与 Intel 各出一份。
mac:
  icon: build/icon.icns
  category: public.app-category.finance
  darkModeSupport: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 跳过签名与公证；正式分发时改成自己的 Developer ID 并打开 hardenedRuntime
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    # 只作为菜单栏常驻程序运行，不在 Dock 里显示
    LSUIElement: true
    NSHumanReadableCopyright: Copyright © 2026 Market Pulse
dmg:
  title: ${productName}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
linux:
  icon: build/icon-512.png
  category: Office
