<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="分红型">
  <title>分红型</title>
  <defs>
    <linearGradient id="dividend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--tone-a, #F6CB5C)"/>
      <stop offset="1" stop-color="var(--tone-b, #DCA02A)"/>
    </linearGradient>
    <linearGradient id="dividend-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#dividend)"/>
  <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#dividend-gloss)"/>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
  <g fill="#FFFFFF">
    <ellipse cx="32" cy="43.4" rx="12" ry="3.4" opacity="0.7"/>
    <ellipse cx="32" cy="34.4" rx="12" ry="3.4" opacity="0.87"/>
    <ellipse cx="32" cy="25.4" rx="12" ry="3.4"/>
  </g>
  <ellipse cx="32" cy="25.4" rx="4.8" ry="1.2" fill="url(#dividend)"/>
  </g>
</svg>
